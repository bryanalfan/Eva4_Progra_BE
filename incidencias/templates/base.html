<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}ViajaChile | Viajes y Turismo{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f9;
            color: #222;
        }
        header {
            background: #075985;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        header a { color: white; text-decoration: none; margin-left: 18px; }
        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }
        h1 { color: #075985; }
        .boton { display: inline-block; margin-top: 20px; text-decoration: none; padding: 10px 18px; border-radius: 8px; background: #075985; color: white; }
    </style>
    {% block estilos %}{% endblock %}
</head>
<body>
    <header>
        <strong>ViajaChile | Viajes y Turismo</strong>
        <nav>
            <a href="/">Inicio</a>
            <a href="/api/">API</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>
    <main>
        {% block contenido %}
        <p>Contenido por defecto.</p>
        {% endblock %}
    </main>
</body>
</html>
